server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI streaming responses can sit idle for a while between chunks - a local model
        # especially can pause well past nginx's 60s default, which silently kills the
        # connection with nothing logged on either side. proxy_buffering off matters too:
        # without it nginx holds the whole response until it ends or fills its buffer,
        # defeating the point of streaming even before any timeout is hit.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;

        # Photos sent to /meal-logs/parse-image are whole camera frames - a few megabytes
        # each. nginx's default ceiling is 1m, which rejects them here with a 413 the API
        # never sees, so the client can only report that the photo could not be read.
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
